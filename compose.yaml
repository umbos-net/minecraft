services:
  minecraft:
    container_name: minecraft
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
    volumes:
      - data:/data
    env_file:
      - ./.env
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
volumes:
  data:

